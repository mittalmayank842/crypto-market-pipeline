name: Docker image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: crypto-pipeline:test
      - name: Run tests inside the image
        run: docker run --rm crypto-pipeline:test python -m pytest -q
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/crypto-market-pipeline:latest,ghcr.io/${{ github.repository_owner }}/crypto-market-pipeline:${{ github.sha }}
